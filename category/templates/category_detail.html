{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <h3 class="display-6">Detalhes da Categoria</h3>

        <div class="card">
            <div class="card-body">
                <h3 class="card-title">{{ category.name }}</h3>
                <p class="card-text">{{ category.description }}</p>
            </div>
        </div>
        
        {% include "components/_detail_info.html" with object=category %}
        <a href="{% url 'category_list' %}" class="btn btn-secondary mt-3">Voltar para a Lista de Categorias</a>
    </div>
{% endblock %}
