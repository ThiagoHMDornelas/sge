{% extends 'base.html' %}

{% block title %}
SGE - Marcas
{% endblock%}

{% block content %}

    <div class="row mb-3">
        <div class="col-md-6">
            <form method="get" action="{% url 'brand_list' %}">
                <div class="input-group">
                    <input type="text" class="form-control" name="name" placeholder="Nome" value="{{ request.GET.name }}">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <a href="{% url 'brand_create' %}" class="btn btn-success float-end">
                <i class="bi bi-plus"></i> Nova Marca
            </a>
        </div>        
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead>
                <th style="width: 5px;">ID</th>
                <th style="width: 70px;">Nome</th>
                <th style="width: 470px;">Descrição</th>
                <th style="width: 30px; text-align: center;">Ações</th>
            </thead>
            <tbody>
                {% for brand in brands %}
                    <tr>
                        <td> {{ brand.id }} </td>
                        <td> {{ brand.name }} </td>
                        <td> {{ brand.description }} </td>
                        <td>
                            <a href="{% url 'brand_detail' brand.id %}" class="btn btn-info btn-sm">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a href="{% url 'brand_update' brand.id %}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a href="{% url 'brand_delete' brand.id %}" class="btn btn-danger btn-sm btn-delete">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    {% include "components/_pagination.html" %}

{% endblock %}
