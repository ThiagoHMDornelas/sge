{% extends 'base.html' %}

{% block title %}SGE - Excluir Marca{% endblock %}

{% block content %}
    <div class="page-header">
        <h3><i class="fas fa-trash me-2" style="color: #f87171;"></i>Excluir Marca</h3>
        <a href="{% url 'brand_list' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i> Voltar
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card delete-card">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; border-radius: 0.75rem; background: rgba(239, 68, 68, 0.12); flex-shrink: 0;">
                            <i class="fas fa-exclamation-triangle" style="color: #f87171; font-size: 1.15rem;"></i>
                        </div>
                        <p class="mb-0" style="color: var(--sge-text); font-size: 0.95rem;">Tem certeza de que deseja excluir a marca <strong style="color: var(--sge-violet-lighter);">"{{ object.name }}"</strong>?</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-1"></i> Confirmar Exclusão
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
