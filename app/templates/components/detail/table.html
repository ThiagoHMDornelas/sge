<div class="detail-info">
    <table class="table table-borderless table-sm m-0">
        <tr>
            <th style="color: var(--sge-text-muted); font-weight: 700; width: 130px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;">
                <i class="bi bi-clock-history me-1" style="color: var(--sge-violet-light);"></i> Criado em
            </th>
            <td>
                {{ object.created_at|date:"d/m/Y H:i" }}
                <span style="background: rgba(139, 92, 246, 0.12); color: var(--sge-violet-lighter); padding: 2px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem;">
                    {{ object.user_created_display }}
                </span>
            </td>
        </tr>
        <tr>
            <th style="color: var(--sge-text-muted); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;">
                <i class="bi bi-arrow-clockwise me-1" style="color: var(--sge-violet-light);"></i> Atualizado em
            </th>
            <td>
                {{ object.updated_at|date:"d/m/Y H:i" }}
                <span style="background: rgba(139, 92, 246, 0.12); color: var(--sge-violet-lighter); padding: 2px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem;">
                    {{ object.user_updated_display }}
                </span>
            </td>
        </tr>
    </table>
</div>
