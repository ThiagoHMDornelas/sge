<div class="row g-4 mt-1">
    <div class="col-md-3">
        <div class="metric-card cyan">
            <div class="d-flex align-items-center gap-3">
                <div class="metric-icon" style="background: rgba(6, 182, 212, 0.15); color: #22d3ee;">
                    <i class="fas fa-receipt"></i>
                </div>
                <div>
                    <div class="metric-label">Quantidade de Vendas</div>
                    <div class="metric-value">{{ sales_metrics.total_sales }}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="metric-card amber">
            <div class="d-flex align-items-center gap-3">
                <div class="metric-icon" style="background: rgba(245, 158, 11, 0.15); color: #fbbf24;">
                    <i class="fas fa-box-open"></i>
                </div>
                <div>
                    <div class="metric-label">Produtos Vendidos</div>
                    <div class="metric-value">{{ sales_metrics.total_product_sold }}</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="metric-card green">
            <div class="d-flex align-items-center gap-3">
                <div class="metric-icon" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">
                    <i class="fas fa-money-bill-wave"></i>
                </div>
                <div>
                    <div class="metric-label">Valor das Vendas</div>
                    <div class="metric-value">R$ {{ sales_metrics.total_sales_value }}</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="metric-card pink">
            <div class="d-flex align-items-center gap-3">
                <div class="metric-icon" style="background: rgba(236, 72, 153, 0.15); color: #f472b6;">
                    <i class="fas fa-arrow-trend-up"></i>
                </div>
                <div>
                    <div class="metric-label">Lucro das Vendas</div>
                    <div class="metric-value">R$ {{ sales_metrics.total_sales_profit }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
