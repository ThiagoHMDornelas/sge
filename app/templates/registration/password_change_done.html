{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-5 col-md-7">
        <div class="card">
            <div class="card-body p-5 text-center">
                <div class="mx-auto d-flex align-items-center justify-content-center" style="width: 64px; height: 64px; border-radius: 50%; background: rgba(16, 185, 129, 0.12); margin-bottom: 1.25rem;">
                    <i class="fas fa-check-circle" style="color: #34d399; font-size: 2rem;"></i>
                </div>
                <h4 style="color: #6ee7b7; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem;">Senha alterada com sucesso!</h4>
                <p style="color: var(--sge-text-muted); font-size: 0.875rem;">Sua senha foi atualizada. Use a nova senha para fazer login.</p>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home me-1"></i> Voltar ao Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
