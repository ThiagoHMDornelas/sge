{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <h3 class="display-6">Detalhes do Fornecedor</h3>

        <div class="card">
            <div class="card-body">
                <h3 class="card-title">{{ supplier.name }}</h3>
                <p class="card-text">{{ supplier.description }}</p>
            </div>
        </div>
        
        {% include "components/_detail_info.html" with object=supplier %}
        <a href="{% url 'supplier_list' %}" class="btn btn-secondary mt-3">Voltar para a Lista de Fornecedores</a>
    </div>
{% endblock %}
