{% extends 'base.html' %}

{% block title %}SGE - Registrar Entrada{% endblock %}

{% block content %}
    <div class="page-header">
        <h3><i class="fas fa-arrow-down me-2" style="color: #10b981;"></i>Registrar Entrada</h3>
        <a href="{% url 'inflow_list' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i> Voltar
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="post" class="form">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" name="save" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Registrar Entrada
                            </button>
                            <button type="submit" name="save_and_new" class="btn btn-success">
                                <i class="fas fa-plus me-1"></i> Registrar e adicionar nova
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
